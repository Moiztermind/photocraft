# Fork-only (Moiztermind/photocraft): every push to `moiztermind/stable` builds an unsigned
# Windows x64 photocraft.exe and replaces the rolling "stable" pre-release, which the other PCs'
# updater (photocraft-workshop/updater) downloads. Never part of an upstream PR.
name: Moiz stable build

on:
  push:
    branches: [moiztermind/stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moiz-stable
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
  CRAFT_FONTS_REF: abb83316d96aa59c1cf64784289e378fe9fa5695

jobs:
  windows:
    if: github.repository == 'Moiztermind/photocraft'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out craft-fonts (embedded fonts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: moiz-stable-windows-x64
      - name: Build
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: cargo build --release -p photocraft
      # Image > AI Upscale 2x runs Real-ESRGAN (BSD-3-Clause) as a separate program from a
      # "realesrgan" folder next to photocraft.exe. Pinned release, every file checked by hash.
      - name: Fetch Real-ESRGAN
        shell: pwsh
        run: |
          $url = "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip"
          Invoke-WebRequest $url -OutFile esrgan.zip
          Expand-Archive esrgan.zip -DestinationPath esrgan-src
          $src = (Get-ChildItem esrgan-src -Recurse -Filter realesrgan-ncnn-vulkan.exe | Select-Object -First 1).DirectoryName
          $want = @{
            "realesrgan-ncnn-vulkan.exe"            = "07e49f7cbb4ede01ae4dd4c399d3a7e5846e3d2085c3128eff881e55cb7b1a0c"
            "vcomp140.dll"                          = "8f72ef2e483465444b2059fc6744d6cb22cd8d8a27f6fa56befd2a42dcd0f78b"
            "models/realesr-animevideov3-x2.bin"    = "548a36f9c3f4ab8da56cd3b13badf23968bee207b396dad14d04b830e5f2ab2d"
            "models/realesr-animevideov3-x2.param"  = "b88ff4f00ebf019a7fdac17fdd45a7fd3665d37509efc5baf2e4da2e24420a04"
            "models/realesrgan-x4plus.bin"          = "713ee713b0353afaa27976f0563a64a5043bd70b9bd8936c2e26e25ebcdbcddf"
            "models/realesrgan-x4plus.param"        = "35330ececcea33b6c397a72548e788d5d53becee4734c50b7fada36e89f10a86"
          }
          New-Item -ItemType Directory -Force pkg/realesrgan/models | Out-Null
          foreach ($f in $want.Keys) {
            $hash = (Get-FileHash (Join-Path $src $f) -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $want[$f]) { throw "Real-ESRGAN $f hash $hash does not match" }
            Copy-Item (Join-Path $src $f) (Join-Path pkg/realesrgan $f)
          }
          Copy-Item packaging/moiz/REALESRGAN-NOTICE.txt pkg/realesrgan/
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/photocraft.exe pkg/
          Compress-Archive -Path pkg/* -DestinationPath dist/photocraft-windows-x64.zip
          $hash = (Get-FileHash dist/photocraft-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$env:GITHUB_SHA $hash" | Out-File -Encoding ascii -NoNewline dist/stable.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stable
          path: dist/*
          if-no-files-found: error

  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stable
          path: dist
      - name: Replace the rolling "stable" pre-release
        working-directory: dist
        run: |
          gh release delete stable --cleanup-tag --yes 2>/dev/null || true
          gh release create stable --prerelease --target "$GITHUB_SHA" \
            --title "Moiz stable (${GITHUB_SHA::9})" \
            --notes "Unsigned Windows x64 build of moiztermind/stable at ${GITHUB_SHA}. Not an official PhotoCraft release." \
            -- photocraft-windows-x64.zip stable.txt
